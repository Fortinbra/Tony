name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, CoPilotChanges ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_PREVIEW: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password
          MONGO_INITDB_DATABASE: tony_test
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        include-prerelease: ${{ env.DOTNET_PREVIEW }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore Tony.sln

    - name: Build solution
      run: dotnet build Tony.sln --configuration Release --no-restore

    - name: Run unit tests
      run: |
        dotnet test Tony.sln \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger trx \
          --results-directory "TestResults" \
          --collect:"XPlat Code Coverage" \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: Generate code coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@5.2.0
      with:
        reports: 'TestResults/**/coverage.opencover.xml'
        targetdir: 'CodeCoverage'
        reporttypes: 'Html;Cobertura;MarkdownSummary'

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: 'CodeCoverage/Cobertura.xml'
        fail_ci_if_error: false
        verbose: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-coverage
        path: CodeCoverage

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        recreate: true
        path: CodeCoverage/Summary.md

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password
          MONGO_INITDB_DATABASE: tony_integration_test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        include-prerelease: ${{ env.DOTNET_PREVIEW }}

    - name: Build application
      run: |
        dotnet build src/Tony/Tony.csproj --configuration Release
        
    - name: Start application
      run: |
        cd src/Tony
        dotnet run --configuration Release &
        echo $! > app.pid
        sleep 10
      env:
        ASPNETCORE_ENVIRONMENT: Testing
        ConnectionStrings__MongoDB: mongodb://root:password@localhost:27017/tony_integration_test?authSource=admin

    - name: Health check
      run: |
        curl -f http://localhost:5000/api/health/detailed || exit 1

    - name: Stop application
      run: |
        if [ -f src/Tony/app.pid ]; then
          kill $(cat src/Tony/app.pid) || true
        fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        include-prerelease: ${{ env.DOTNET_PREVIEW }}

    - name: Restore dependencies
      run: dotnet restore Tony.Tests.sln

    - name: Security scan with DevSkim
      uses: microsoft/DevSkim-Action@v1

    - name: Dependency vulnerability scan
      run: dotnet list package --vulnerable --include-transitive

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
